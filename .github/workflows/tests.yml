name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 = the oldest Python the app supports (macOS system python3);
          # newer Ubuntu images no longer ship a 3.9 build
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no model server needed)
        run: python -m unittest discover -s tests -v
      - name: Python files compile
        run: python -m py_compile server.py storage.py rescore.py
      - name: Benchmark files are valid
        run: |
          python - <<'PY'
          import server
          bad = [b for b in server.all_benchmarks() if b.get("error") or not b.get("cases")]
          for b in bad:
              print("BROKEN:", b.get("_file") or b["id"], b.get("error") or "no cases")
          raise SystemExit(1 if bad else 0)
          PY
      - name: Frontend syntax
        if: matrix.python-version == '3.13'
        run: node --check web/app.js
